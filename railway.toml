# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không set startCommand: Railway chạy nó KHÔNG qua shell nên biến $PORT
# không được expand (lỗi "Invalid value for '--port': '$PORT'"). Để trống,
# Railway dùng CMD của Dockerfile — CMD đó chạy qua `sh -c` nên expand đúng.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
