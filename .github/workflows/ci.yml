name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency
        run: pip install -r requirements.txt

      - name: Chạy test (bỏ CP5 và bonus — cần bản deploy đang sống)
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t day12-chat:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lên Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service K4-DAY12-2A202601876-DoVietTung --detach

      - name: Smoke test sau deploy
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/healthz"
